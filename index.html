

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator</title>
<link rel="stylesheet" href="calcu.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="calculator">
  <div class="naz">
    <b>Nazullah</b>
  </div>
    
    <div class="display">
        <div class="history" id="history"></div>
        <input type="text" id="display" placeholder="0" readonly>
        <button id="themeBtn" onclick="chengTheme()">&#128161;</button>
    </div>

    <div class="buttons">

        <button class="gray" onclick="clearScreen()">C</button>
        <button class="gray" onclick="backspace()">
    <i class="fa-solid fa-delete-left"></i>
</button>
        <button class="gray" onclick="appendValue('%')">%</button>
        <button class="orange" onclick="appendValue('/')">÷</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="orange" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="orange" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="orange" onclick="appendValue('+')">+</button>

        <button class="zero" onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="orange" onclick="calculate()">=</button>

    </div>

</div>

<script src="calcu.js"></script>

</body>
</html>
